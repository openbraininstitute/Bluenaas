name: Publish PRODUCTION images

permissions:
  id-token: write # Required for OIDC authentication
  contents: write

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  determine_tag:
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.tag.outputs.new_tag }}
    steps:
      - name: Fail if branch is not main
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "This workflow should not be triggered with workflow_dispatch on a branch other than main"
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Get full history to check existing tags

      - name: Set up Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine and create new tag
        id: tag
        run: |
          YEAR=$(date +'%Y')
          MONTH=$(date +'%m')
          DAY=$(date +'%d')
          LATEST_TAG=$(git tag --sort=-v:refname | grep -E "^${YEAR}\.${MONTH}\.${DAY}\.[0-9]+$" | head -n 1 || echo "")

          if [[ -z "$LATEST_TAG" ]]; then
            COUNTER=1
          else
            COUNTER=$(( ${LATEST_TAG##*.} + 1 ))
          fi

          NEW_TAG="${YEAR}.${MONTH}.${DAY}.${COUNTER}"
          echo "new_tag=${NEW_TAG}" >> "$GITHUB_OUTPUT"
          git tag "$NEW_TAG"
          git push origin "$NEW_TAG"
          echo "Created new tag: $NEW_TAG"

  publish-to-aws-ecr:
    needs: determine_tag
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - image_name: api
            runner: ubuntu-24.04-arm
            dockerfile: Dockerfile.api
            platforms: linux/amd64,linux/arm64
          - image_name: worker
            runner: ubuntu-latest
            dockerfile: Dockerfile.worker
            platforms: linux/amd64 # ARM64 blocked by obi-one dep chain (pylmesh, bluepyefe, bluepysnap)
    env:
      ENVIRONMENT: "prod"
      IMAGE_NAME: ${{ vars.PUBLICECR_URI }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        if: contains(matrix.platforms, 'arm64')
        uses: docker/setup-qemu-action@v4
        with:
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.PUBLIC_ECR_UPLOAD_ROLE_ARN }}
          aws-region: ${{ vars.PUBLICECR_REGION }}

      - name: Authenticate with AWS ECR
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Build and push ${{ matrix.image_name }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ matrix.image_name }}-${{ needs.determine_tag.outputs.new_tag }}
          build-args: |
            ENVIRONMENT=${{ env.ENVIRONMENT }}
          secrets: |
            GH_PRIVATE_REPO_TOKEN=${{ secrets.GH_PRIVATE_REPO_TOKEN }}
